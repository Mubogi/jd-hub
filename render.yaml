# Render Blueprint for JD Hub (free-tier web service + free PostgreSQL).
# Deploy via: New > Blueprint > connect this repo.
# Render will create the web service and database defined below.
# After the first deploy, set DJANGO_SECRET_KEY and an admin password as
# environment variables (see README → Deploying to Render).
#
# Note: preDeployCommand is paid-plan only, so build.sh (migrate, collectstatic,
# seed, ensuresuperuser) runs as part of buildCommand instead. All steps are
# idempotent, so this is safe on every deploy.
services:
  - type: web
    name: jd-hub
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt && bash build.sh
    startCommand: gunicorn jdhub.wsgi:application --log-file -
    healthCheckPath: /
    envVars:
      - key: DJANGO_DEBUG
        value: "0"
      - key: PYTHON_VERSION
        value: "3.13.4"
      # Generate a strong key and paste it in Render's dashboard (secret).
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DJANGO_WHATSAPP_NUMBER
        value: "256754687597"
      - key: DJANGO_CONTACT_EMAIL
        value: "jordandesignhub@gmail.com"
      # Admin login (created on first build by ensuresuperuser).
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: WEB_CONCURRENCY
        value: "2"
      # Google Meet auto-creation. GOOGLE_SERVICE_ACCOUNT_JSON must be the FULL
      # contents of the service-account JSON key file. GOOGLE_CALENDAR_ID is the
      # Google Calendar to create events on (share it with the service account
      # email with "Make changes to events" permission). See hub/meet.py.
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_CALENDAR_ID
        value: "jordandesignhub@gmail.com"
      # Auto-linked to the database below.
      - fromDatabase:
          name: jd-hub-db
          property: connectionString
        key: DATABASE_URL

databases:
  - name: jd-hub-db
    plan: free
    ipAllowList: []

